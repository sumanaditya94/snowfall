name: 🔥 Cozy Fireplace Crackling ❄️ Snowy Cabin Winter Ambience (No Music)
on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check video file
        run: ls -la video.mp4 || echo "Video file not found in root!"

      - name: Stream to YouTube
        env:
          STREAM_KEY: ${{ secrets.YOUTUBE_STREAM_KEY }}
        run: |
          ffmpeg -stream_loop -1 -i video.mp4 \
            -c:v libx264 -b:v 2500k -maxrate 2500k -bufsize 5000k \
            -pix_fmt yuv420p -g 50 \
            -c:a aac -b:a 128k \
            -f flv rtmp://a.rtmp.youtube.com/live2/$STREAM_KEY || echo "Stream failed - check key or file"
